<link rel="canonical" href="{{ .Permalink }}" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png" />
<style>
  body { overflow-wrap: anywhere; }
  pre { overflow-x: auto; overflow-wrap: normal; }
  nav a { display: inline-block; margin-bottom: .4rem; }
  table { display: block; max-width: 100%; overflow-x: auto; }
  img { height: auto; }
  [hidden] { display: none !important; }
  mjx-container[display="true"] { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
  @media (max-width: 420px) {
    ul.blog-posts li { display: block; margin-bottom: .8rem; }
    ul.blog-posts li span { display: block; }
  }
</style>
{{ if and (eq .Type "blog") (strings.Contains .RawContent "$" ) }}
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
{{ end }}
