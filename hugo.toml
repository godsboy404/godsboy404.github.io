baseURL = 'https://coderama.top/'
title = '沁·拾遗轩'
theme = 'hugo-bearblog'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
enableRobotsTXT = true
publishDir = 'public'

[languages.zh]
  label = '中文'
  locale = 'zh-CN'

[params]
  title = '沁·拾遗轩'
  description = '悟已往之不谏，知来者之可追'
  favicon = 'favicon.ico'
  images = ['images/logo/logo.webp']
  dateFormat = '2006-01-02'
  enablePostNavigator = true
  mainSections = ['blog']
  [params.author]
    name = 'Leo'
    email = 'zrz515@outlook.com'

[taxonomies]
  tag = 'tags'

[outputFormats.RSS]
  baseName = 'rss'

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML', 'RSS']

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]
[markup.highlight]
  style = 'friendly'
  lineNos = true
  lineNumbersInTable = false

[[menus.main]]
  name = '首页'
  url = '/'
  weight = 10
[[menus.main]]
  name = '文章'
  url = '/blog/'
  weight = 20
[[menus.main]]
  name = '标签'
  url = '/tags/'
  weight = 30
[[menus.main]]
  name = '友链'
  url = '/pages/link/'
  weight = 40
[[menus.main]]
  name = '关于'
  url = '/pages/about/'
  weight = 50
