name: Build and deploy Stellar blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Stellar configuration
        run: npm run doctor
      - name: Build
        run: npm run build
      - name: Check generated site
        run: npm run check
      - name: Test browser scripts
        run: npm test
      - name: Save validated build
        uses: actions/upload-artifact@v4
        with:
          name: stellar-site
          path: public/
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: stellar-site
          path: public/
      - name: Deploy to existing pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: pages
          cname: coderama.top
