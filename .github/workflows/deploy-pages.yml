name: Build and deploy Hugo blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
      - name: Build
        run: hugo --gc --minify --panicOnWarning
      - name: Check generated site
        run: python3 scripts/check_site.py
      - name: Set up Node for regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser scripts
        # Dependencies are test-only; Hugo remains the site's only build tool.
        run: |
          npm install --prefix /tmp/blog-tests --no-save --ignore-scripts --package-lock=false linkedom@0.18.12
          BLOG_TEST_MODULES=/tmp/blog-tests/node_modules node --test tests/browser-scripts.test.cjs
      - name: Save validated build
        uses: actions/upload-artifact@v4
        with:
          name: hugo-site
          path: public/
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: hugo-site
          path: public/
      - name: Deploy to existing pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: pages
          cname: coderama.top
